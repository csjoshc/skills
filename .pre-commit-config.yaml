# Blocks a commit that stages a secret. Uses the brew gitleaks, so no network fetch at hook time.
# Enable once per clone: pre-commit install
repos:
  - repo: local
    hooks:
      - id: gitleaks
        name: gitleaks
        entry: gitleaks git --pre-commit --staged --redact --no-banner
        language: system
        pass_filenames: false
