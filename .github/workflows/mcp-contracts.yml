name: Scoped credential boundaries

on:
  push:
    branches: [main]
    paths: ['sync/**', 'confluence/**', 'shared/credential_exec.py', 'shared/test_credential_exec.py', '.github/workflows/mcp-contracts.yml']
  pull_request:
    paths: ['sync/**', 'confluence/**', 'shared/credential_exec.py', 'shared/test_credential_exec.py', '.github/workflows/mcp-contracts.yml']

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Scoped credential process boundary
        run: python -B -I shared/test_credential_exec.py
      - name: Confluence scoped REST operation
        run: bash confluence/scripts/test_confluence_env.sh
      - name: Shared and native skill ownership
        run: python -B -I sync/test_sync_skill_links.py
