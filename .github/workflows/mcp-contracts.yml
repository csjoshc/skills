name: MCP credential preservation

on:
  push:
    branches: [main]
    paths: ['sync/**', 'shared/credential_exec.py', 'shared/test_credential_exec.py', '.github/workflows/mcp-contracts.yml']
  pull_request:
    paths: ['sync/**', 'shared/credential_exec.py', 'shared/test_credential_exec.py', '.github/workflows/mcp-contracts.yml']

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Native Windows scoped-reader preservation
        run: python -I sync/test_mcp_sync.py ScopedReconciliation
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install legacy-format test prerequisite
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: MCP preservation and legacy-format contracts
        run: python -I sync/test_mcp_sync.py
      - name: Scoped credential process boundary
        run: python -B -I shared/test_credential_exec.py
